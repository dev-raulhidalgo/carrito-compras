<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>E-commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5 text-center">
    <h1 class="mb-5">Bienvenido a Nuestra Aplicación de E-commerce GRANADACOMERCIO</h1>

    <a th:href="@{/products}" class="btn btn-primary btn-lg">Ver Catálogo de Productos</a>
    <a th:href="@{/cart}" class="btn btn-secondary btn-lg">Ver Carrito</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-warning btn-lg">Administrar Productos</a>
    <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-outline-primary btn-lg">Iniciar sesión</a>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-danger btn-lg">Cerrar sesión</button>
    </form>

    <div class="card mt-5 text-start">
        <div class="card-header"><h5 class="mb-0">Últimas Noticias</h5></div>
        <div class="card-body">Próximamente nuevas novedades en nuestra tienda.</div>
    </div>
</body>
</html>
