<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1 class="text-center mb-4">Catálogo de Productos</h1>

    <div class="mb-4 d-flex flex-wrap gap-2 align-items-center">
        <a th:href="@{/}" class="btn btn-secondary">Inicio</a>
        <a th:href="@{/cart}" class="btn btn-secondary">Ver Carrito</a>

        <!-- Solo ADMIN: gestión del catálogo -->
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/products/add}" class="btn btn-success">Añadir producto</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-warning">Panel de administración</a>

        <span class="ms-auto" sec:authorize="isAuthenticated()">
            Sesión: <strong sec:authentication="name"></strong>
        </span>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-outline-primary ms-auto">Iniciar sesión</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger">Cerrar sesión</button>
        </form>
    </div>

    <!-- Búsqueda y filtro por precio -->
    <form th:action="@{/products}" method="get" class="row g-2 mb-4">
        <div class="col-md-5">
            <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Buscar por nombre">
        </div>
        <div class="col-md-2">
            <input type="number" step="0.01" min="0" name="min" th:value="${min}" class="form-control" placeholder="Precio mín.">
        </div>
        <div class="col-md-2">
            <input type="number" step="0.01" min="0" name="max" th:value="${max}" class="form-control" placeholder="Precio máx.">
        </div>
        <div class="col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Filtrar</button>
            <a th:href="@{/products}" class="btn btn-outline-secondary">Limpiar</a>
        </div>
    </form>

    <p th:if="${products.isEmpty()}" class="text-muted">No se han encontrado productos.</p>

    <div class="row g-3">
        <div class="col-md-4" th:each="p : ${products}">
            <div class="card h-100">
                <img th:if="${!#strings.isEmpty(p.imageUrl)}" th:src="${p.imageUrl}" class="card-img-top"
                     alt="imagen del producto" style="height:200px;object-fit:cover;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.name}"></h5>
                    <p class="card-text" th:text="${#numbers.formatDecimal(p.price, 1, 2) + ' €'}"></p>
                    <div class="d-flex flex-wrap gap-2">
                        <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post">
                            <button type="submit" class="btn btn-primary">Agregar al Carrito</button>
                        </form>
                        <!-- Solo ADMIN: editar / eliminar -->
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/products/edit/{id}(id=${p.id})}"
                           class="btn btn-warning">Editar</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/products/delete/{id}(id=${p.id})}" method="post">
                            <button type="submit" class="btn btn-danger">Eliminar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
