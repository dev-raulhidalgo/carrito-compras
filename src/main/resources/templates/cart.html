<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Mi carrito</h1>

    <p th:if="${items.isEmpty()}">El carrito está vacío.</p>

    <table class="table" th:unless="${items.isEmpty()}">
        <thead>
            <tr><th>Producto</th><th>Precio</th><th></th></tr>
        </thead>
        <tbody>
            <tr th:each="p : ${items}">
                <td th:text="${p.name}"></td>
                <td th:text="${p.price} + ' €'"></td>
                <td>
                    <form th:action="@{/cart/remove/{id}(id=${p.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <h4 th:unless="${items.isEmpty()}" th:text="'Total: ' + ${total} + ' €'"></h4>

    <a th:href="@{/products}" class="btn btn-primary">Seguir comprando</a>
    <a th:href="@{/}" class="btn btn-secondary">Inicio</a>
</body>
</html>
