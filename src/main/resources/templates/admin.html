<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrar Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar bg-light px-3 mb-4">
        <div class="ms-auto d-flex gap-2">
            <a th:href="@{/products}" class="btn btn-secondary">Ver Catálogo de Productos</a>
            <a th:href="@{/cart}" class="btn btn-secondary">Ver Carrito</a>
            <a th:href="@{/admin/export}" class="btn btn-primary">Descargar Base de Datos (SQL)</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-danger">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center mb-4">Administrar Productos</h1>

        <div class="card mb-4">
            <div class="card-header"><h5 class="mb-0">Agregar Nuevo Producto</h5></div>
            <div class="card-body">
				<form th:action="@{/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
				    <div class="mb-3">
				        <label class="form-label">Nombre del Producto</label>
				        <input type="text" th:field="*{name}" class="form-control" placeholder="Nombre del producto" required>
				    </div>
				    <div class="mb-3">
				        <label class="form-label">Precio</label>
				        <input type="number" step="0.01" min="0" th:field="*{price}" class="form-control" placeholder="Precio" required>
				    </div>
				    <div class="mb-3">
				        <label class="form-label">Imagen (opcional)</label>
				        <input type="file" name="imageFile" class="form-control" accept="image/*">
				    </div>
				    <button type="submit" class="btn btn-primary w-100">Agregar Producto</button>
				</form>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header"><h5 class="mb-0">Productos Existentes</h5></div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    th:each="p : ${products}">
                    <div class="d-flex align-items-center gap-3">
                        <img th:if="${!#strings.isEmpty(p.imageUrl)}" th:src="${p.imageUrl}" alt="imagen"
                             style="width:60px;height:60px;object-fit:cover;border-radius:6px;">
                        <div>
                            <strong th:text="${p.name}"></strong><br>
                            <span class="text-muted" th:text="${p.price} + ' €'"></span>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
