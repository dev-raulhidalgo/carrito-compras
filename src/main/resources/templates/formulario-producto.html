<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Producto</h1>

    <form th:action="@{/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{imageUrl}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" min="0" th:field="*{price}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Imagen (opcional)</label>
            <div class="mb-2">
                <img id="vistaPrevia" th:src="${product.imageUrl}" alt="imagen del producto"
                     th:classappend="${#strings.isEmpty(product.imageUrl)} ? 'd-none'"
                     style="height:80px;border-radius:6px;">
            </div>
            <input type="file" name="imageFile" id="imageFile" class="form-control" accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/admin}" class="btn btn-secondary">Cancelar</a>
    </form>

    <script>
        document.getElementById('imageFile').addEventListener('change', function () {
            const archivo = this.files[0];
            const vista = document.getElementById('vistaPrevia');
            if (archivo) {
                vista.src = URL.createObjectURL(archivo);
                vista.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
