<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 400px;">
    <h1>Iniciar sesión</h1>

    <div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
    <div class="alert alert-success" th:if="${param.logout}">Has cerrado sesión.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
        <a th:href="@{/}" class="btn btn-secondary">Volver</a>
    </form>
</body>
</html>
